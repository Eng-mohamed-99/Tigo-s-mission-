<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title id="siteTitle">مهام تيغو 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  const cfg={apiKey:"AIzaSyAx_xs43amXxWr1TChmoQ3i3Ybgv2wozUc",authDomain:"daily-tasks-c7681.firebaseapp.com",databaseURL:"https://daily-tasks-c7681-default-rtdb.firebaseio.com",projectId:"daily-tasks-c7681",storageBucket:"daily-tasks-c7681.firebasestorage.app",messagingSenderId:"344494417669",appId:"1:344494417669:web:aee74696bc9642f902396c"};
  const app=initializeApp(cfg),db=getDatabase(app);
  window._db=db;window._ref=ref;window._set=set;window._remove=remove;window._onValue=onValue;
  window._fbReady=true;document.dispatchEvent(new Event("fb-ready"));
</script>
<style>
:root{--p:#667eea;--p2:#764ba2;--acc:#c084fc;--bg:#f0edfb;--bg2:#fde8f3;--card:#fff;--text:#1a1a2e;--text2:#9a8fa0;--border:#ede8f8;--sh:rgba(102,126,234,0.10);--sh2:rgba(0,0,0,0.06);--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;}
body.dark{--bg:#0d0d1a;--bg2:#12121f;--card:#16162a;--text:#e4dff0;--text2:#5a4f70;--border:#22203a;--sh:rgba(0,0,0,0.4);--sh2:rgba(0,0,0,0.4);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',sans-serif;background:var(--bg);min-height:100vh;direction:rtl;transition:background .4s,color .4s;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--acc);border-radius:99px}

/* ROLE */
.role-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--bg),var(--bg2))}
.role-card{background:var(--card);border-radius:28px;padding:40px 28px;max-width:380px;width:100%;box-shadow:0 20px 60px var(--sh);text-align:center;animation:fadeUp .6s cubic-bezier(.34,1.56,.64,1)}
.role-logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--p),var(--acc));display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 20px;box-shadow:0 8px 30px rgba(102,126,234,.45);animation:float 3s ease-in-out infinite}
.role-title{font-size:26px;font-weight:900;color:var(--text);margin-bottom:6px}
.role-sub{font-size:14px;color:var(--text2);margin-bottom:32px}
.role-btn{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:20px;border:2px solid var(--border);background:var(--bg);cursor:pointer;width:100%;text-align:right;transition:all .25s cubic-bezier(.34,1.56,.64,1);margin-bottom:12px}
.role-btn:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 10px 30px var(--sh)}
.role-av{width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:white;flex-shrink:0}
.role-name{font-size:17px;font-weight:800;color:var(--text)}
.role-desc{font-size:12px;color:var(--text2);margin-top:2px}
.role-arrow{margin-right:auto;color:var(--acc);font-size:20px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;display:inline-block;margin-left:6px}

/* LOGIN */
.overlay{position:fixed;inset:0;background:rgba(10,8,25,.75);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(10px)}
.login-card{background:var(--card);border-radius:26px;padding:36px 28px;text-align:center;max-width:320px;width:90%;animation:bounceIn .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.login-inp{width:100%;padding:14px;border-radius:14px;border:2.5px solid var(--border);font-family:'Tajawal',sans-serif;font-size:22px;text-align:center;outline:none;letter-spacing:8px;color:var(--text);background:var(--bg);transition:all .2s;margin-bottom:8px}
.login-inp:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(102,126,234,.15)}
.login-inp.err{border-color:var(--red)!important;animation:shake .4s ease}
.login-btn{width:100%;padding:14px;margin-top:8px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--p),var(--p2));color:white;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(102,126,234,.45);transition:all .2s}
.login-btn:hover{transform:scale(1.02)}
.back-btn{width:100%;padding:11px;margin-top:8px;border-radius:14px;border:none;background:transparent;font-family:'Tajawal',sans-serif;font-size:14px;color:var(--text2);cursor:pointer;display:block}
.err-txt{color:var(--red);font-size:13px;min-height:18px}

/* APP */
.app{max-width:100%;margin:0 auto;padding:14px 14px 128px}
@media(min-width:768px){
  .app{max-width:100%;padding:20px 40px 100px}
  .card{border-radius:18px}
  .add-panel,.hist-card,.report-card,.pts-bar{border-radius:20px}
  body{font-size:15px}
}

/* HEADER */
.header{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:22px;padding:14px 18px;margin-bottom:12px;box-shadow:0 4px 20px var(--sh2)}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-av-wrap{position:relative}
.hdr-av{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:white;cursor:pointer;overflow:hidden}
.hdr-av img{width:100%;height:100%;object-fit:cover}
.hdr-online{position:absolute;bottom:-2px;left:-2px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid var(--card)}
.hdr-name{font-size:17px;font-weight:800;color:var(--text)}
.hdr-mood{font-size:13px;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:6px}
.hdr-btn{width:36px;height:36px;border-radius:10px;border:2px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .2s;color:var(--text)}
.hdr-btn:hover{border-color:var(--acc);background:var(--bg);transform:scale(1.1)}
.sync-chip{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;background:#f0fdf4;color:var(--green);font-size:11px;font-weight:700}
.sync-chip.busy{background:#fffbeb;color:var(--yellow)}
.s-dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}

/* TOGETHER BANNER */
.together-banner{background:linear-gradient(135deg,#667eea,#f472b6);border-radius:16px;padding:12px 18px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:white;animation:slideDown .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 16px rgba(102,126,234,.35)}

/* WATCHING BANNER */
.watching-banner{background:linear-gradient(135deg,#f59e0b,#ef4444);border-radius:16px;padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:white;animation:slideDown .4s ease}

/* MOOD PICKER */
.mood-card{background:var(--card);border-radius:20px;padding:16px 18px;margin-bottom:12px;box-shadow:0 4px 20px var(--sh2)}
.mood-title{font-size:13px;font-weight:800;color:var(--text2);margin-bottom:10px}
.mood-row{display:flex;gap:8px;flex-wrap:wrap}
.mood-btn{padding:8px 14px;border-radius:99px;border:2px solid var(--border);background:var(--bg);font-size:14px;cursor:pointer;transition:all .2s;font-family:'Tajawal',sans-serif;font-weight:600}
.mood-btn:hover{transform:scale(1.08)}
.mood-btn.sel{border-color:var(--acc);background:rgba(192,132,252,.15);box-shadow:0 2px 8px rgba(192,132,252,.3)}
.mood-display{font-size:15px;font-weight:700;color:var(--acc)}

/* MORNING/EVENING MSG */
.msg-card{border-radius:20px;padding:16px 20px;margin-bottom:12px;position:relative;overflow:hidden}
.msg-card.morning{background:linear-gradient(135deg,#fef9c3,#fde68a)}
.msg-card.evening{background:linear-gradient(135deg,#ede9fe,#ddd6fe)}
body.dark .msg-card.morning{background:linear-gradient(135deg,#3d3000,#2d2200)}
body.dark .msg-card.evening{background:linear-gradient(135deg,#1a0040,#12002e)}
.msg-icon{font-size:28px;margin-bottom:6px}
.msg-text{font-size:15px;font-weight:700;color:#1a1a2e;line-height:1.5}
body.dark .msg-text{color:#e4dff0}
.msg-from{font-size:11px;color:#6b5b8e;margin-top:4px;font-weight:600}

/* ADMIN MSG EDITOR */
.msg-editor{background:var(--card);border-radius:20px;padding:16px 18px;margin-bottom:12px;box-shadow:0 4px 20px var(--sh2)}
.msg-editor-title{font-size:13px;font-weight:800;color:var(--text2);margin-bottom:10px}
.msg-tabs{display:flex;gap:6px;margin-bottom:10px}
.msg-tab{flex:1;padding:8px;border-radius:10px;border:2px solid var(--border);background:var(--bg);font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer;transition:all .2s;text-align:center}
.msg-tab.on{background:linear-gradient(135deg,var(--p),var(--acc));color:white;border-color:transparent}
.msg-inp{width:100%;padding:10px 14px;border-radius:12px;border:2px solid var(--border);font-family:'Tajawal',sans-serif;font-size:14px;color:var(--text);background:var(--bg);outline:none;direction:rtl;margin-bottom:8px;transition:border-color .2s}
.msg-inp:focus{border-color:var(--p)}
.msg-save{padding:9px 20px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--p),var(--acc));color:white;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.msg-save:hover{transform:scale(1.05)}

/* POINTS BAR */
.pts-bar{background:linear-gradient(135deg,var(--p),var(--acc));border-radius:20px;padding:16px 20px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 24px rgba(102,126,234,.35);position:relative;overflow:hidden}
.pts-bar::before{content:'';position:absolute;top:-40px;left:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.pts-lbl{color:rgba(255,255,255,.8);font-size:12px;font-weight:600}
.pts-val{font-size:32px;font-weight:900;color:white}
.streak-num{font-size:22px;font-weight:900;color:white}
.streak-lbl{font-size:11px;color:rgba(255,255,255,.7);margin-top:2px}

/* NOTIF */
.notif{display:flex;align-items:center;gap:10px;border-radius:16px;padding:13px 16px;margin-bottom:12px;font-size:14px;font-weight:700;animation:slideDown .5s cubic-bezier(.34,1.56,.64,1)}
.notif-b{background:linear-gradient(135deg,var(--p),var(--p2));color:white;box-shadow:0 4px 16px rgba(102,126,234,.35)}
.notif-g{background:linear-gradient(135deg,var(--green),#16a34a);color:white;box-shadow:0 4px 16px rgba(34,197,94,.35)}
.notif-r{background:linear-gradient(135deg,var(--red),#dc2626);color:white;box-shadow:0 4px 16px rgba(239,68,68,.35)}

/* PROGRESS */
.prog-card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 4px 20px var(--sh2)}
.prog-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.prog-lbl{font-size:15px;font-weight:800;color:var(--text)}
.prog-sub{font-size:11px;color:var(--text2);margin-top:3px}
.prog-pct{font-size:32px;font-weight:900;background:linear-gradient(135deg,var(--p),var(--acc));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.prog-track{height:11px;background:var(--border);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--acc));transition:width .8s cubic-bezier(.34,1.56,.64,1)}
.stats-r{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;text-align:center;padding:9px;border-radius:12px;font-size:12px;font-weight:700}
.st-p{background:#fff0f7;color:#e879a0}
.st-d{background:#f0fdf4;color:var(--green)}

/* ADD PANEL */
.add-panel{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 4px 20px var(--sh2)}
.add-ttl{font-size:12px;font-weight:800;color:var(--text2);margin-bottom:12px;letter-spacing:.5px}
.add-row{display:flex;gap:8px;margin-bottom:10px}
.add-inp{flex:1;padding:13px 16px;border-radius:14px;border:2.5px solid var(--border);font-family:'Tajawal',sans-serif;font-size:15px;color:var(--text);background:var(--bg);outline:none;transition:all .2s;direction:rtl}
.add-inp::placeholder{color:var(--text2)}
.add-inp:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(102,126,234,.12)}
.add-go{width:50px;height:50px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 4px 16px rgba(102,126,234,.4);transition:all .2s;font-size:24px;color:white}
.add-go:hover{transform:scale(1.08)}
.add-go:active{transform:scale(.94)}
.add-opts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.add-sel{flex:1;min-width:100px;padding:10px 12px;border-radius:12px;border:2px solid var(--border);font-family:'Tajawal',sans-serif;font-size:13px;color:var(--text);background:var(--bg);outline:none;cursor:pointer}
.add-cmt{width:100%;padding:10px 14px;border-radius:12px;border:2px solid var(--border);font-family:'Tajawal',sans-serif;font-size:13px;color:var(--text);background:var(--bg);outline:none;direction:rtl;transition:border-color .2s}
.add-cmt:focus{border-color:var(--p)}
.add-cmt::placeholder{color:var(--text2)}
.urgent-toggle{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 12px;border-radius:12px;border:2px solid var(--border);background:var(--bg);cursor:pointer;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;color:var(--text);transition:all .2s;width:fit-content}
.urgent-toggle.on{border-color:var(--red);background:#fef2f2;color:var(--red)}
.repeat-toggle{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 12px;border-radius:12px;border:2px solid var(--border);background:var(--bg);cursor:pointer;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;color:var(--text);transition:all .2s;width:fit-content}
.repeat-toggle.on{border-color:var(--p);background:rgba(102,126,234,.08);color:var(--p)}

/* NAV */
.nav{display:flex;background:var(--card);border-radius:16px;padding:5px;margin-bottom:12px;gap:4px;box-shadow:0 2px 12px var(--sh2)}
.nav-btn{flex:1;padding:10px 6px;border:none;background:transparent;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;color:var(--text2);border-radius:11px;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:5px}
.nav-btn.on{background:linear-gradient(135deg,var(--p),var(--p2));color:white;box-shadow:0 4px 14px rgba(102,126,234,.4)}
.nav-badge{min-width:20px;height:20px;border-radius:99px;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;background:rgba(255,255,255,.25);color:inherit}

/* PERIOD */
.period{margin-bottom:12px;animation:fadeUp .4s ease both}
.period-hdr{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;cursor:pointer;transition:all .2s;user-select:none}
.ph-sabah{background:linear-gradient(135deg,#fef9c3,#fde68a)}
.ph-zuhr{background:linear-gradient(135deg,#dbeafe,#bfdbfe)}
.ph-asr{background:linear-gradient(135deg,#fce7f3,#fbcfe8)}
.ph-masa{background:linear-gradient(135deg,#ede9fe,#ddd6fe)}
body.dark .ph-sabah{background:linear-gradient(135deg,#3d3000,#2d2200)}
body.dark .ph-zuhr{background:linear-gradient(135deg,#00213d,#001c35)}
body.dark .ph-asr{background:linear-gradient(135deg,#3d0025,#2d001c)}
body.dark .ph-masa{background:linear-gradient(135deg,#1a0040,#12002e)}
.ph-icon{font-size:24px}
.ph-name{font-size:15px;font-weight:800;color:#1a1a2e;flex:1}
body.dark .ph-name{color:#e4dff0}
.ph-cnt{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.55);color:#1a1a2e}
body.dark .ph-cnt{background:rgba(255,255,255,.15);color:#e4dff0}
.ph-arr{font-size:16px;color:#6b5b8e;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.ph-arr.open{transform:rotate(90deg)}
.task-list{display:flex;flex-direction:column;gap:8px;padding:2px 0}

/* CARD */
.card{background:var(--card);border-radius:16px;padding:14px 15px;box-shadow:0 2px 12px var(--sh2);position:relative;border:2px solid transparent;transition:all .25s cubic-bezier(.34,1.56,.64,1);animation:slideIn .3s ease both}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--sh)}
.card.done-c{opacity:.6}
.card.hl{border-color:#86efac!important;background:#f0fdf4!important}
.card.urgent-c{border-color:var(--red)!important}
.urgent-tag{position:absolute;top:-8px;right:12px;background:linear-gradient(135deg,var(--red),#dc2626);color:white;font-size:10px;font-weight:700;padding:2px 10px;border-radius:99px;animation:pulse 2s infinite}
.repeat-tag{position:absolute;top:-8px;left:12px;background:linear-gradient(135deg,var(--p),var(--acc));color:white;font-size:10px;font-weight:700;padding:2px 10px;border-radius:99px}
.new-tag{position:absolute;top:-8px;left:12px;background:linear-gradient(135deg,var(--green),#16a34a);color:white;font-size:10px;font-weight:700;padding:2px 10px;border-radius:99px}
.card-top{display:flex;align-items:center;gap:10px}
.chk{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--border);background:transparent;font-size:15px;font-weight:800;color:white;display:flex;align-items:center;justify-content:center;transition:all .3s cubic-bezier(.34,1.56,.64,1);flex-shrink:0;cursor:pointer}
.chk.on{background:linear-gradient(135deg,var(--green),#16a34a);border-color:transparent;box-shadow:0 4px 14px rgba(34,197,94,.45)}
.chk.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.chk:disabled{cursor:default}
.card-body{flex:1;min-width:0}
.card-title-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.c-emoji{font-size:19px}
.c-text{font-size:15px;font-weight:600;color:var(--text);line-height:1.4}
.c-text.done-t{text-decoration:line-through;color:var(--text2)}
.pri-tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px}
.pri-h{background:#fef2f2;color:var(--red)}
.pri-m{background:#fffbeb;color:var(--yellow)}
.pri-l{background:#f0fdf4;color:var(--green)}
.c-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.c-meta span{font-size:11px;color:var(--text2)}
.c-meta .done-t2{color:var(--green)}
.c-cmt{font-size:12px;color:var(--p);margin-top:6px;padding:7px 11px;background:rgba(102,126,234,.08);border-radius:10px;border-right:3px solid var(--p);line-height:1.5}
.del-btn{width:32px;height:32px;border-radius:10px;border:none;background:#fef2f2;color:var(--red);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;flex-shrink:0;font-size:14px}
.card:hover .del-btn{opacity:1}

/* LIKE */
.like-btn{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .2s;flex-shrink:0}
.like-btn.liked{border-color:#f472b6;background:#fff0f7;transform:scale(1.15)}
.like-btn:hover{transform:scale(1.1)}

/* TIGO AREA */
.tigo-area{margin-top:10px;padding-top:10px;border-top:1.5px dashed var(--border)}
.tigo-cmt-row{display:flex;gap:8px;margin-bottom:8px}
.tigo-inp{flex:1;padding:9px 13px;border-radius:12px;border:2px solid var(--border);font-family:'Tajawal',sans-serif;font-size:13px;color:var(--text);background:var(--bg);outline:none;direction:rtl;transition:border-color .2s}
.tigo-inp:focus{border-color:var(--acc)}
.tigo-send{padding:9px 16px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--p),var(--acc));color:white;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.tigo-cmt-display{font-size:12px;color:var(--acc);font-weight:700;margin-bottom:8px;padding:6px 12px;background:rgba(192,132,252,.1);border-radius:10px;border-right:3px solid var(--acc)}
.emo-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.emo-btn{padding:5px 11px;border-radius:99px;border:2px solid var(--border);background:var(--bg);font-size:12px;cursor:pointer;transition:all .2s;font-family:'Tajawal',sans-serif;font-weight:600}
.emo-btn:hover{border-color:var(--acc);transform:scale(1.08)}
.emo-btn.picked{border-color:var(--acc);background:rgba(192,132,252,.15)}
.emo-show{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:8px}
.diff-row{display:flex;gap:6px;margin-bottom:8px}
.diff-btn{flex:1;padding:7px;border-radius:10px;border:2px solid var(--border);background:var(--bg);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Tajawal',sans-serif;text-align:center}
.diff-btn.d-easy{border-color:var(--green);color:var(--green)}
.diff-btn.d-easy.sel{background:var(--green);color:white}
.diff-btn.d-med{border-color:var(--yellow);color:var(--yellow)}
.diff-btn.d-med.sel{background:var(--yellow);color:white}
.diff-btn.d-hard{border-color:var(--red);color:var(--red)}
.diff-btn.d-hard.sel{background:var(--red);color:white}
.diff-show{font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px;display:inline-block;margin-bottom:8px}
.photo-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:99px;border:2px dashed var(--border);background:transparent;font-family:'Tajawal',sans-serif;font-size:12px;color:var(--text2);cursor:pointer;transition:all .2s}
.photo-btn:hover{border-color:var(--acc);color:var(--acc)}
.proof-img{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:6px;cursor:pointer;transition:transform .2s}
.proof-img:hover{transform:scale(1.02)}

/* FLOAT */
.float{position:absolute;top:-44px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--p),var(--p2));color:white;font-size:13px;font-weight:700;padding:7px 18px;border-radius:99px;white-space:nowrap;z-index:100;pointer-events:none;box-shadow:0 4px 16px rgba(102,126,234,.4);animation:floatUp 2.2s ease forwards}

/* COLOR PICKER */
.color-card{background:var(--card);border-radius:18px;padding:16px 18px;margin-bottom:12px;box-shadow:0 4px 20px var(--sh2)}
.color-ttl{font-size:12px;font-weight:800;color:var(--text2);margin-bottom:12px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .25s cubic-bezier(.34,1.56,.64,1);position:relative;display:flex;align-items:center;justify-content:center;color:transparent;font-size:16px;font-weight:900}
.sw.on{border-color:var(--text);transform:scale(1.2);color:white}

/* PRIDE MOMENT */
.pride-card{background:linear-gradient(135deg,#f472b6,#c084fc);border-radius:20px;padding:18px 20px;margin-bottom:12px;text-align:center;animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 30px rgba(244,114,182,.4)}
.pride-icon{font-size:40px;margin-bottom:8px;animation:float 2s ease-in-out infinite}
.pride-text{font-size:16px;font-weight:800;color:white;margin-bottom:4px}
.pride-sub{font-size:13px;color:rgba(255,255,255,.8)}
.pride-dismiss{padding:8px 20px;border-radius:99px;border:2px solid rgba(255,255,255,.5);background:transparent;color:white;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;margin-top:12px;transition:all .2s}
.pride-dismiss:hover{background:rgba(255,255,255,.2)}

/* GIFT */
.gift-card{background:linear-gradient(135deg,#fcd34d,#f97316);border-radius:20px;padding:18px 20px;margin-bottom:12px;text-align:center;animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 30px rgba(249,115,22,.4)}

/* SECRET MSG */
.secret-card{background:linear-gradient(135deg,#1a1a2e,#2d1b4e);border-radius:20px;padding:20px;margin-bottom:12px;text-align:center;animation:fadeUp .5s ease;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.secret-lock{font-size:36px;margin-bottom:10px;animation:bounce 2s infinite}
.secret-text{font-size:15px;font-weight:700;color:white;line-height:1.6}
.secret-from{font-size:12px;color:rgba(255,255,255,.6);margin-top:8px}

/* DAILY REPORT */
.report-card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 4px 20px var(--sh2)}
.report-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.report-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.report-row:last-child{border-bottom:none}
.report-lbl{font-size:13px;color:var(--text2)}
.report-val{font-size:14px;font-weight:800;color:var(--text)}

/* HISTORY */
.hist-card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 4px 20px var(--sh2)}
.hist-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:14px}
.week-bars{display:flex;gap:8px;align-items:flex-end;height:80px;margin-bottom:8px}
.day-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.day-bar-bg{flex:1;width:100%;background:var(--border);border-radius:6px;position:relative;overflow:hidden;min-height:8px}
.day-bar-fill{position:absolute;bottom:0;left:0;right:0;border-radius:6px;background:linear-gradient(0deg,var(--p),var(--acc));transition:height .8s cubic-bezier(.34,1.56,.64,1)}
.day-lbl{font-size:10px;color:var(--text2);font-weight:600}
.day-pct{font-size:10px;color:var(--p);font-weight:800}
.hist-day{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;border:1.5px solid var(--border);margin-bottom:8px;cursor:pointer;transition:all .2s}
.hist-day:hover{border-color:var(--acc);background:rgba(192,132,252,.05)}
.hist-day-name{font-size:13px;font-weight:700;color:var(--text)}
.hist-day-sub{font-size:11px;color:var(--text2);margin-top:2px}
.hist-day-pct{font-size:18px;font-weight:900;color:var(--p)}

/* EMPTY */
.empty{text-align:center;padding:40px 20px}
.empty-icon{font-size:54px;margin-bottom:14px;animation:float 3s ease-in-out infinite}
.empty-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--text2);line-height:1.6}

/* IMG MODAL */
.img-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px;cursor:pointer}
.img-modal img{max-width:100%;max-height:90vh;border-radius:16px}

/* CARTOON POPUP */
.cartoon-pop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9997;backdrop-filter:blur(6px)}
.cartoon-card{background:white;border-radius:28px;padding:32px;text-align:center;max-width:300px;width:90%;animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 30px 80px rgba(0,0,0,.4)}
.cartoon-emoji{font-size:80px;animation:float 1.5s ease-in-out infinite}
.cartoon-text{font-size:18px;font-weight:800;color:#1a1a2e;margin-top:16px;margin-bottom:8px}
.cartoon-sub{font-size:14px;color:#9a8fa0;margin-bottom:20px}
.cartoon-close{padding:12px 28px;border-radius:99px;border:none;background:linear-gradient(135deg,#667eea,#c084fc);color:white;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;cursor:pointer}

/* BADGES */
.badges-card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 4px 20px var(--sh2)}
.badges-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:14px}
.badges-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge-item{text-align:center;padding:10px 6px;border-radius:14px;border:2px solid var(--border);transition:all .2s;position:relative}
.badge-item.earned{border-color:var(--acc);background:rgba(192,132,252,.1);box-shadow:0 4px 14px rgba(192,132,252,.2)}
.badge-item.locked{opacity:.4;filter:grayscale(1)}
.badge-icon{font-size:28px;margin-bottom:4px}
.badge-name{font-size:10px;font-weight:700;color:var(--text);line-height:1.3}
.badge-new{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--red);font-size:9px;color:white;display:flex;align-items:center;justify-content:center;font-weight:800}

/* NEWS POPUP */
.news-pop{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9996;backdrop-filter:blur(8px)}
.news-card{background:linear-gradient(135deg,#1a1a2e,#2d1b4e);border-radius:24px;padding:28px 24px;max-width:320px;width:90%;animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center}
.news-header{background:linear-gradient(135deg,var(--p),var(--acc));color:white;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:800;margin-bottom:14px;letter-spacing:1px}
.news-icon{font-size:50px;margin-bottom:12px;animation:bounce 2s infinite}
.news-text{font-size:14px;font-weight:700;color:white;line-height:1.7;margin-bottom:16px}
.news-close{padding:10px 24px;border-radius:99px;border:2px solid rgba(255,255,255,.4);background:transparent;color:white;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.news-close:hover{background:rgba(255,255,255,.15)}

/* DIARY */
.diary-card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 4px 20px var(--sh2)}
.diary-title{font-size:15px;font-weight:800;color:var(--text);margin-bottom:4px}
.diary-date{font-size:11px;color:var(--text2);margin-bottom:12px}
.diary-inp{width:100%;min-height:100px;padding:12px 16px;border-radius:14px;border:2px solid var(--border);font-family:'Tajawal',sans-serif;font-size:14px;color:var(--text);background:var(--bg);outline:none;resize:none;direction:rtl;transition:border-color .2s;line-height:1.6}
.diary-inp:focus{border-color:var(--acc)}
.diary-inp::placeholder{color:var(--text2)}
.diary-save{padding:9px 20px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--p),var(--acc));color:white;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:8px}
.diary-saved{font-size:12px;color:var(--green);font-weight:700;margin-top:6px}
.diary-entry{padding:10px 14px;border-radius:12px;background:var(--bg);margin-bottom:8px;border-right:3px solid var(--acc)}
.diary-entry-date{font-size:11px;color:var(--text2);margin-bottom:4px}
.diary-entry-text{font-size:13px;color:var(--text);line-height:1.6}

/* WEEKLY SUMMARY */
.summary-pop{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:9995;backdrop-filter:blur(10px);padding:20px}
.summary-card{background:linear-gradient(160deg,var(--p),var(--acc));border-radius:28px;padding:28px 24px;max-width:340px;width:100%;animation:bounceIn .6s cubic-bezier(.34,1.56,.64,1);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.summary-title{font-size:22px;font-weight:900;color:white;text-align:center;margin-bottom:6px}
.summary-sub{font-size:13px;color:rgba(255,255,255,.8);text-align:center;margin-bottom:20px}
.summary-stat{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(255,255,255,.15);border-radius:12px;margin-bottom:8px}
.summary-stat-lbl{font-size:13px;color:rgba(255,255,255,.9);font-weight:600}
.summary-stat-val{font-size:18px;font-weight:900;color:white}
.summary-close{width:100%;padding:13px;border-radius:14px;border:2px solid rgba(255,255,255,.4);background:transparent;color:white;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;transition:all .2s}
.summary-close:hover{background:rgba(255,255,255,.2)}

/* DANGER */
.danger{display:flex;align-items:center;gap:8px;margin:16px auto 0;padding:10px 22px;border-radius:99px;border:none;background:#fef2f2;color:var(--red);font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}

/* WELCOME OVERLAY */
.welcome-overlay{position:fixed;inset:0;background:rgba(10,8,25,.85);display:flex;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(12px);animation:fadeIn .4s ease}
.welcome-card{background:linear-gradient(160deg,#1a1a2e,#2d1b4e);border-radius:28px;padding:36px 28px;max-width:330px;width:90%;animation:bounceIn .6s cubic-bezier(.34,1.56,.64,1);box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;border:1px solid rgba(192,132,252,.25)}
.welcome-logo{font-size:64px;margin-bottom:8px;animation:float 2s ease-in-out infinite}
.welcome-title{font-size:24px;font-weight:900;color:white;margin-bottom:6px}
.welcome-msg{font-size:15px;font-weight:600;color:rgba(255,255,255,.8);line-height:1.7;margin-bottom:20px}
.welcome-stars{font-size:22px;letter-spacing:4px;margin-bottom:16px;animation:pulse 2s infinite}
.welcome-btn{width:100%;padding:14px;border-radius:16px;border:none;background:linear-gradient(135deg,var(--p),var(--acc));color:white;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 6px 24px rgba(102,126,234,.5);transition:all .2s}
.welcome-btn:hover{transform:scale(1.03)}
.welcome-from{font-size:12px;color:rgba(255,255,255,.45);margin-top:14px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ══ INTERACTIVE ROOM PAGE ══ */
.room-page{position:fixed;inset:0;z-index:8000;background:linear-gradient(160deg,#1a0a2e,#2d1060,#0d0520);display:flex;flex-direction:column;overflow:hidden}
.room-page-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.room-page-title{font-size:16px;font-weight:900;color:white}
.room-page-pts{font-size:12px;color:#c084fc;font-weight:700}
.room-page-close{background:rgba(255,255,255,.1);border:none;color:white;font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.room-scene-wrap{flex:1;position:relative;overflow:hidden}
.room-bg{position:absolute;inset:0}
.room-wall{position:absolute;top:0;left:0;right:0;height:55%;background:linear-gradient(180deg,#2d1b69 0%,#4c1d95 60%,#6d28d9 100%)}
.room-floor{position:absolute;bottom:0;left:0;right:0;height:45%;background:linear-gradient(180deg,#7c3aed 0%,#5b21b6 50%,#3b0764 100%)}
.room-floor-shine{position:absolute;bottom:0;left:0;right:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.08) 0%,transparent 40%)}
.room-wall-pattern{position:absolute;top:0;left:0;right:0;height:55%;opacity:.15;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.3) 0px,rgba(255,255,255,.3) 1px,transparent 1px,transparent 40px),repeating-linear-gradient(0deg,rgba(255,255,255,.3) 0px,rgba(255,255,255,.3) 1px,transparent 1px,transparent 40px)}
.room-baseboard{position:absolute;bottom:45%;left:0;right:0;height:8px;background:linear-gradient(180deg,#7c3aed,#4c1d95);box-shadow:0 2px 10px rgba(0,0,0,.5)}
/* Room items */
.room-item-wrap{position:absolute;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1),filter .2s}
.room-item-wrap:hover{transform:scale(1.12)!important;filter:drop-shadow(0 0 12px rgba(192,132,252,.8))}
.room-item-wrap.locked{cursor:not-allowed;filter:grayscale(1) brightness(.4)}
.room-item-wrap.locked:hover{transform:scale(1)!important}
.room-item-emoji{font-size:44px;display:block;text-align:center;animation:roomFloat 3s ease-in-out infinite}
.room-item-lbl{font-size:9px;color:rgba(255,255,255,.7);text-align:center;font-weight:700;margin-top:2px}
.room-item-lock{font-size:10px;color:rgba(255,255,255,.4);text-align:center}
/* Room tooltip */
.room-tooltip{position:absolute;background:rgba(15,5,30,.95);border:1px solid rgba(192,132,252,.4);border-radius:16px;padding:14px;min-width:200px;z-index:100;animation:fadeUp .2s ease;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.room-tooltip-name{font-size:14px;font-weight:900;color:white;margin-bottom:4px}
.room-tooltip-desc{font-size:12px;color:rgba(255,255,255,.7);line-height:1.5;margin-bottom:8px}
.room-tooltip-lvl{display:flex;gap:4px}
.room-tooltip-star{font-size:12px}
/* Room upgrade btn */
.room-upgrade-btn{width:100%;padding:10px;border-radius:12px;border:none;background:linear-gradient(135deg,#7c3aed,#c084fc);color:white;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:800;cursor:pointer;margin-top:8px;pointer-events:all}
/* Room progress bar */
.room-prog-bar{flex-shrink:0;padding:10px 18px;background:rgba(0,0,0,.3)}
.room-prog-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.room-prog-lbl{font-size:11px;color:rgba(255,255,255,.7);font-weight:700}
.room-prog-track{height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;flex:1;margin:0 10px}
.room-prog-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#c084fc);border-radius:99px;transition:width .5s ease}
/* Room item panel */
.room-item-panel{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(15,5,30,.0),rgba(15,5,30,.98));padding:20px 18px 24px;animation:slideUp .3s ease;border-top:1px solid rgba(192,132,252,.2)}
.room-panel-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.room-panel-emoji{font-size:36px}
.room-panel-info{flex:1}
.room-panel-name{font-size:16px;font-weight:900;color:white}
.room-panel-status{font-size:12px;color:#c084fc;font-weight:700}
.room-panel-desc{font-size:13px;color:rgba(255,255,255,.8);line-height:1.6;margin-bottom:12px}
.room-panel-levels{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.room-level-dot{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;transition:all .3s}
.room-level-dot.done{background:linear-gradient(135deg,#7c3aed,#c084fc);border-color:#c084fc}
.room-level-dot.current{background:rgba(192,132,252,.3);border-color:#c084fc;animation:pulse 1s infinite}
.room-upgrade-row{display:flex;gap:8px}
.room-upgrade-big{flex:1;padding:13px;border-radius:14px;border:none;background:linear-gradient(135deg,#7c3aed,#c084fc);color:white;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 20px rgba(124,58,237,.4)}
.room-upgrade-big:disabled{opacity:.4;cursor:not-allowed}
.room-close-panel{padding:13px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:transparent;color:white;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;cursor:pointer}
@keyframes roomFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ══ INTERACTIVE GARDEN PAGE ══ */
.garden-page{position:fixed;inset:0;z-index:8000;background:linear-gradient(180deg,#87ceeb 0%,#98d8c8 30%,#4ade80 60%,#16a34a 100%);display:flex;flex-direction:column;overflow:hidden}
.garden-page-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.3);flex-shrink:0}
.garden-page-title{font-size:16px;font-weight:900;color:#14532d}
.garden-page-close{background:rgba(255,255,255,.3);border:none;color:#14532d;font-size:18px;width:36px;height:36px;border-radius:50%;cursor:pointer}
/* Sky */
.garden-sky{position:absolute;top:0;left:0;right:0;height:35%;background:linear-gradient(180deg,#60a5fa 0%,#93c5fd 60%,#bfdbfe 100%)}
.garden-cloud{position:absolute;font-size:32px;opacity:.8;animation:cloudDrift var(--cd,20s) linear infinite}
@keyframes cloudDrift{from{transform:translateX(-60px)}to{transform:translateX(calc(100vw + 60px))}}
/* Ground */
.garden-ground{position:absolute;bottom:0;left:0;right:0;height:65%}
.garden-soil{position:absolute;bottom:0;left:0;right:0;height:30%;background:linear-gradient(180deg,#854d0e 0%,#92400e 40%,#78350f 100%);border-radius:40% 40% 0 0}
.garden-grass{position:absolute;bottom:28%;left:0;right:0;height:60px;background:linear-gradient(180deg,#22c55e 0%,#16a34a 100%);border-radius:40% 40% 0 0}
.garden-grass-top{position:absolute;bottom:calc(28% + 55px);left:0;right:0;overflow:hidden;height:20px}
/* Flower plots */
.garden-plots{position:absolute;bottom:28%;left:0;right:0;display:flex;justify-content:space-around;align-items:flex-end;padding:0 10px}
.garden-plot{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .2s}
.garden-plot:hover{transform:scale(1.1)}
.garden-plot-flower{font-size:36px;transition:all .3s;animation:flowerSway 3s ease-in-out infinite}
.garden-plot-flower.wilted{filter:grayscale(1) brightness(.6);animation:none;transform:rotate(20deg)}
.garden-plot-flower.locked{filter:grayscale(1);opacity:.3;animation:none}
.garden-plot-flower.blooming{animation:flowerSway 2s ease-in-out infinite,flowerGlow 2s ease-in-out infinite}
.garden-plot-stem{width:3px;height:20px;background:linear-gradient(180deg,#16a34a,#15803d);margin:0 auto}
.garden-plot-pot{font-size:20px}
.garden-plot-lbl{font-size:9px;font-weight:700;color:#14532d;text-align:center;margin-top:2px;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:6px}
/* Garden panel */
.garden-panel{position:absolute;bottom:0;left:0;right:0;background:rgba(20,83,45,.95);backdrop-filter:blur(20px);padding:20px 18px 28px;animation:slideUp .3s ease;border-top:2px solid rgba(74,222,128,.3)}
.garden-panel-emoji{font-size:40px;text-align:center;margin-bottom:6px}
.garden-panel-name{font-size:16px;font-weight:900;color:white;text-align:center;margin-bottom:4px}
.garden-panel-status{font-size:12px;color:#4ade80;text-align:center;margin-bottom:10px}
.garden-panel-desc{font-size:13px;color:rgba(255,255,255,.8);line-height:1.6;text-align:center;margin-bottom:14px}
.garden-water-btn{width:100%;padding:14px;border-radius:16px;border:none;background:linear-gradient(135deg,#0ea5e9,#38bdf8);color:white;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 4px 20px rgba(14,165,233,.4);margin-bottom:8px}
.garden-close-btn{width:100%;padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:transparent;color:white;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
/* Stats bar */
.garden-stats{flex-shrink:0;display:flex;gap:0;background:rgba(0,0,0,.2)}
.garden-stat{flex:1;text-align:center;padding:8px 4px;border-right:1px solid rgba(255,255,255,.1)}
.garden-stat:last-child{border-right:none}
.garden-stat-n{font-size:16px;font-weight:900;color:white}
.garden-stat-l{font-size:9px;color:rgba(255,255,255,.7);font-weight:600}
/* Water drop animation */
.water-drop{position:absolute;font-size:20px;pointer-events:none;animation:waterFall .8s ease-in forwards}
@keyframes waterFall{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(60px)}}
@keyframes flowerSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flowerGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,200,0,.3))}50%{filter:drop-shadow(0 0 12px rgba(255,200,0,.8))}}
/* Points milestone popup */
.pts-milestone{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(8px)}
.pts-milestone-card{background:linear-gradient(135deg,#fbbf24,#f59e0b,#d97706);border-radius:28px;padding:32px 24px;text-align:center;max-width:300px;width:88%;animation:bounceIn .6s cubic-bezier(.34,1.56,.64,1);box-shadow:0 20px 60px rgba(245,158,11,.5)}
.pts-milestone-icon{font-size:64px;margin-bottom:8px;animation:bounce 1s infinite}
.pts-milestone-title{font-size:22px;font-weight:900;color:white;margin-bottom:8px}
.pts-milestone-msg{font-size:14px;color:rgba(255,255,255,.9);line-height:1.6;margin-bottom:16px}
.pts-milestone-close{width:100%;padding:13px;border-radius:16px;border:none;background:rgba(255,255,255,.25);color:white;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:800;cursor:pointer}

/* ══ STARS SKY ══ */
.sky-card{border-radius:22px;padding:18px;margin-bottom:12px;background:linear-gradient(160deg,#0f0c29,#1a1a3e,#24243e);box-shadow:0 4px 20px rgba(0,0,0,.4);position:relative;overflow:hidden}
.sky-title{font-size:14px;font-weight:800;color:rgba(255,255,255,.9);margin-bottom:10px}
.sky-field{position:relative;min-height:100px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center}
.star-item{font-size:18px;animation:starTwinkle 2s ease-in-out infinite;cursor:default}
.star-item:hover{transform:scale(1.4)}
.sky-moon{position:absolute;top:8px;left:16px;font-size:36px;animation:float 4s ease-in-out infinite}
.sky-msg{font-size:12px;font-weight:700;color:rgba(255,255,255,.7);text-align:center;margin-top:8px}
@keyframes starTwinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

/* ══ MOOD METER ══ */
.moodmeter-card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 4px 20px var(--sh2);text-align:center}
.moodmeter-title{font-size:14px;font-weight:800;color:var(--text2);margin-bottom:12px}
.heart-meter{font-size:48px;transition:all .5s cubic-bezier(.34,1.56,.64,1);display:inline-block;filter:drop-shadow(0 4px 12px rgba(244,114,182,.5));animation:heartbeat 1.5s ease-in-out infinite}
.heart-fill{font-size:13px;font-weight:800;color:#f472b6;margin-top:6px}
.hearts-flying{position:absolute;pointer-events:none}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* ══ MEMORY ALBUM ══ */
.album-card{background:linear-gradient(135deg,#fef3c7,#fde68a);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 4px 20px rgba(245,158,11,.2)}
.album-title{font-size:14px;font-weight:800;color:#78350f;margin-bottom:12px}
.album-grid{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.album-item{flex-shrink:0;background:white;border-radius:14px;padding:12px 10px;text-align:center;min-width:90px;box-shadow:0 2px 10px rgba(0,0,0,.1);animation:fadeUp .4s ease both}
.album-date{font-size:10px;color:#92400e;font-weight:600;margin-bottom:4px}
.album-icon{font-size:24px;margin-bottom:4px}
.album-tasks{font-size:11px;font-weight:800;color:#78350f}
.album-empty{font-size:13px;color:#92400e;text-align:center;padding:10px 0}

/* ══ FUTURE LETTER COUNTDOWN ══ */
.letter-card{background:linear-gradient(135deg,#1a1a2e,#2d1b4e);border-radius:22px;padding:18px;margin-bottom:12px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.letter-title{font-size:14px;font-weight:800;color:rgba(255,255,255,.8);margin-bottom:8px}
.letter-lock{font-size:36px;margin-bottom:8px;animation:bounce 2s infinite}
.letter-countdown{font-size:22px;font-weight:900;color:var(--acc);margin-bottom:6px;font-variant-numeric:tabular-nums}
.letter-sub{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:10px}
.letter-open{font-size:15px;font-weight:800;color:white;animation:pulse 1s infinite}
.letter-admin-form{margin-top:10px}

/* ══ WEEKLY PAPER ══ */
.weekly-paper-card{background:linear-gradient(160deg,#fef9c3,#fde68a);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 4px 20px rgba(245,158,11,.2)}
.wp-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wp-title{font-size:16px;font-weight:900;color:#78350f}
.wp-date{font-size:11px;color:#92400e;margin-bottom:10px}
.wp-headline{font-size:14px;font-weight:800;color:#1a1a2e;line-height:1.5;margin-bottom:8px;padding:10px;background:rgba(255,255,255,.6);border-radius:10px}
.wp-stat-row{display:flex;gap:8px}
.wp-stat{flex:1;text-align:center;background:rgba(255,255,255,.5);border-radius:10px;padding:8px}
.wp-stat-n{font-size:20px;font-weight:900;color:#78350f}
.wp-stat-l{font-size:10px;color:#92400e;font-weight:600}

/* ══ EVENING GIFT BOX ══ */
.egd-card{background:linear-gradient(135deg,#fcd34d,#f97316);border-radius:22px;padding:18px;margin-bottom:12px;text-align:center;box-shadow:0 4px 20px rgba(249,115,22,.3)}
.egd-title{font-size:14px;font-weight:800;color:white;margin-bottom:8px}
.egd-box{font-size:48px;animation:bounce 1s infinite;cursor:pointer;transition:transform .2s}
.egd-box:hover{transform:scale(1.15)}
.egd-msg{font-size:13px;font-weight:700;color:white;line-height:1.6;margin-top:10px}
.egd-timer{font-size:12px;color:rgba(255,255,255,.8);margin-top:6px}

/* ══ JOURNEY MAP ══ */
.journey-card{background:linear-gradient(160deg,#e0f2fe,#bae6fd);border-radius:22px;padding:18px;margin-bottom:12px;box-shadow:0 4px 20px rgba(14,165,233,.2)}
.journey-title{font-size:14px;font-weight:800;color:#0c4a6e;margin-bottom:12px}
.journey-path{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:8px}
.journey-stop{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px}
.journey-icon{font-size:28px;padding:8px;border-radius:50%;transition:all .3s}
.journey-icon.reached{background:linear-gradient(135deg,var(--p),var(--acc));box-shadow:0 4px 14px rgba(102,126,234,.4);animation:float 2s ease-in-out infinite}
.journey-icon.locked{filter:grayscale(1);opacity:.3}
.journey-lbl{font-size:9px;font-weight:700;color:#0c4a6e;text-align:center}
.journey-line{width:20px;height:3px;background:var(--p);opacity:.3;margin-bottom:20px;flex-shrink:0}
.journey-line.reached{opacity:1}
.journey-msg{font-size:12px;font-weight:700;color:#0c4a6e;margin-top:8px;text-align:center}

/* BREAKING NEWS TICKER */
.news-ticker{position:fixed;bottom:0;left:0;right:0;z-index:9990;background:#0d0000;border-top:3px solid #ef4444;height:44px;display:flex;align-items:stretch;overflow:hidden;box-shadow:0 -4px 24px rgba(239,68,68,.5)}
.ticker-label{flex-shrink:0;background:linear-gradient(135deg,#ef4444,#b91c1c);color:white;font-size:13px;font-weight:900;padding:0 18px;display:flex;align-items:center;gap:7px;letter-spacing:.5px;white-space:nowrap}
.ticker-dot{width:9px;height:9px;border-radius:50%;background:white;animation:pulse .7s infinite}
.ticker-track{flex:1;overflow:hidden;position:relative;display:flex;align-items:center;padding:0 12px}
.ticker-text{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;border-right:2px solid #ef4444;animation:tickerReveal var(--td,8s) steps(var(--sc,60),end) forwards}
.ticker-fade{animation:tickerOut .5s ease forwards}
@keyframes tickerReveal{from{width:0}to{width:100%}}
@keyframes tickerOut{from{opacity:1}to{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* PTS POPUP */
.pts-pop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(135deg,var(--p),var(--acc));color:white;padding:20px 36px;border-radius:24px;font-size:26px;font-weight:900;z-index:9997;pointer-events:none;box-shadow:0 20px 60px rgba(102,126,234,.5);text-align:center;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.pts-pop.show{transform:translate(-50%,-50%) scale(1)}

/* FOOTER */
.footer{text-align:center;font-size:11px;color:var(--text2);margin-top:20px}

/* CONFETTI */
.cf{position:fixed;top:-20px;pointer-events:none;z-index:9999;animation:cffall 1.5s ease-in forwards}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px) scale(.97)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounceIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.55)}70%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes floatUp{0%{opacity:0;transform:translateX(-50%) translateY(0)}15%{opacity:1}80%{opacity:1;transform:translateX(-50%) translateY(-32px)}100%{opacity:0;transform:translateX(-50%) translateY(-42px)}}
@keyframes cffall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

function initFb(){if(!window._fbReady)return;$.fbOk=true;if($.mode)listenAll();}

function listenAll(){
  if(!$.fbOk||!$.mode)return;
  // Tasks
  if(fbUnsub)fbUnsub();
  fbUnsub=window._onValue(window._ref(window._db,"tasks2"),snap=>{
    const raw=snap.val()?Object.values(snap.val()):[];
    // Map old format (priority/period names) to new format
    const priMap={"high":"h","med":"m","medium":"m","low":"e","easy":"e","h":"h","m":"m","e":"e"};
    const perMap={"sabah":"sabah","morning":"sabah","masa":"masa","evening":"masa","layl":"layl","night":"layl","anytime":"sabah"};
    const loaded=raw.map(t=>({
      ...t,
      pri:priMap[t.pri]||priMap[t.priority]||"m",
      period:perMap[t.period]||t.period||"sabah",
      emoji:t.emoji||"✅",
      done:t.done||false,
      emotion:t.emotion||"",
      difficulty:t.difficulty||"",
      tiCmt:t.tiCmt||"",
      proofPhoto:t.proofPhoto||"",
      likedBy:t.likedBy||"",
      urgent:t.urgent||false,
      repeat:t.repeat||false,
    }));
    loaded.sort((a,b)=>a.id-b.id);
    const prev=$.tasks;
    const prevDone=new Set(prev.filter(t=>t.done).map(t=>t.id));
    const prevIds=new Set(prev.map(t=>t.id));
    const nowDone=new Set(loaded.filter(t=>t.done).map(t=>t.id));
    const nowIds=new Set(loaded.map(t=>t.id));
    const fd=[...nowDone].filter(id=>!prevDone.has(id));
    const ft=[...nowIds].filter(id=>!prevIds.has(id));
    if(fd.length){fd.forEach(id=>$.newDone.add(id));setTimeout(()=>{$.newDone.clear();render();},4500);}
    if(ft.length){ft.forEach(id=>$.newTask.add(id));setTimeout(()=>{$.newTask.clear();render();},4500);}
    if(loaded.length>0&&loaded.filter(t=>!t.done).length===0&&prev.filter(t=>!t.done).length>0){boom();playWin();}
    $.pts=loaded.filter(t=>t.done).reduce((a,t)=>a+(PRIS[t.pri]?.pts||5),0);
    // Check cartoon milestone
    const doneCount=loaded.filter(t=>t.done).length;
    const prevDoneCount=prev.filter(t=>t.done).length;
    if($.mode==="user"&&Math.floor(doneCount/10)>Math.floor(prevDoneCount/10)&&doneCount>0){
      $.cartoonPop=CARTOON_CHARS[Math.floor(doneCount/10)%CARTOON_CHARS.length];
      $.cartoonCount=doneCount;ls("cartoonCount",$.cartoonCount);
    }
    $.tasks=loaded;$.lastSync=new Date();render();
  });
  // History
  if(fbHistUnsub)fbHistUnsub();
  fbHistUnsub=window._onValue(window._ref(window._db,"hist"),snap=>{$.history=snap.val()||{};render();});
  // Streak
  window._onValue(window._ref(window._db,"streak"),snap=>{if(snap.val()!==null){$.streak=snap.val();ls("streak",$.streak);render();}});
  // Online presence
  const presenceKey=$.mode==="admin"?"admin_online":"user_online";
  window._set(window._ref(window._db,presenceKey),{online:true,time:Date.now()});
  window._onValue(window._ref(window._db,"admin_online"),snap=>{$.adminOnline=snap.val()?.online||false;render();});
  window._onValue(window._ref(window._db,"user_online"),snap=>{$.userOnline=snap.val()?.online||false;render();});
  // Together detection
  window._onValue(window._ref(window._db,"admin_online"),()=>{
    const both=$.adminOnline&&$.userOnline;
    if(both&&!$.togetherActive){$.togetherActive=true;render();}
    else if(!both&&$.togetherActive){$.togetherActive=false;render();}
  });
  // Messages
  window._onValue(window._ref(window._db,"msgs"),snap=>{render();});
  // Pride moment
  window._onValue(window._ref(window._db,"pride"),snap=>{
    const d=snap.val();
    if(d&&!d.seen&&$.mode==="user"){$.prideMsg=d.msg;render();}
  });
  // Gift
  window._onValue(window._ref(window._db,"gift"),snap=>{
    const d=snap.val();
    if(d&&!d.seen&&$.mode==="user"){$.giftMsg=d.msg;render();}
  });
  // Secret message
  window._onValue(window._ref(window._db,"secret"),snap=>{
    const d=snap.val();
    if(d&&!d.seen&&$.mode==="user"){
      const now=Date.now();
      if(d.showAt&&now>=d.showAt){$.secretMsg=d.msg;render();}
    }
  });
  // Profile/settings sync
  window._onValue(window._ref(window._db,"profile"),snap=>{
    if(snap.val()){$.profile={...$.profile,...snap.val()};ls("profile",JSON.stringify($.profile));document.getElementById("siteTitle").textContent=$.profile.siteName||"مهام تيغو 🌸";render();}
  });
  // Future letter sync
  window._onValue(window._ref(window._db,"futureLetter"),snap=>{
    if(snap.val()){$.futureLetter=snap.val();ls("futureLetter",JSON.stringify($.futureLetter));render();}
  });
  setTimeout(()=>checkDailyReset(),2000);
}

async function save(tasks){
  $.syncing=true;render();
  if($.fbOk){const o={};tasks.forEach(t=>{o[t.id]=t;});await window._set(window._ref(window._db,"tasks2"),o);}

async function saveHistory(){
  if(!$.fbOk)return;
  const d=today();
  const snap={date:d,tasks:$.tasks.map(t=>({id:t.id,text:t.text,done:t.done,emoji:t.emoji,pri:t.pri,emotion:t.emotion||"",difficulty:t.difficulty||"",tiCmt:t.tiCmt||""})),total:$.tasks.length,done:$.tasks.filter(t=>t.done).length,pts:$.pts,mood:$.mood||""};
  await window._set(window._ref(window._db,`hist/${d}`),snap);
  await calcStreak();
}

async function calcStreak(){
  if(!$.fbOk)return;
  let streak=0;
  const d=new Date();
  // Check yesterday and before (not today, today might not be done yet)
  for(let i=1;i<=365;i++){
    const check=new Date(d);check.setDate(d.getDate()-i);
    const key=check.toISOString().slice(0,10);
    const day=$.history[key];
    // Count day if at least 1 task was done
    if(day&&day.done>0){streak++;}
    else if(i>1){break;}
  }
  $.streak=streak;ls("streak",streak);
  await window._set(window._ref(window._db,"streak"),streak);
}

async function checkDailyReset(){
  if(!$.fbOk||$.mode!=="admin")return;
  const lastDay=ls("lastDay");
  const todayStr=today();
  if(lastDay&&lastDay!==todayStr){
    await saveHistory();
    // Re-add repeating tasks for new day
    const repeating=$.tasks.filter(t=>t.repeat);
    const newTasks=repeating.map(t=>({...t,id:Date.now()+Math.random(),done:false,doneAt:null,addedAt:nowT(),day:todayStr,emotion:"",difficulty:"",tiCmt:"",proofPhoto:"",likedBy:""}));
    await window._set(window._ref(window._db,"tasks2"),newTasks.length?Object.fromEntries(newTasks.map(t=>[t.id,t])):null);
  }
  ls("lastDay",todayStr);
}

// ══ DOM HELPERS ══
function el(tag,attrs={},...ch){
  const e=document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="cls")e.className=v;
    else if(k==="style")typeof v==="string"?e.setAttribute("style",v):Object.assign(e.style,v);
    else if(k==="disabled"){if(v)e.disabled=true;}
    else e.setAttribute(k,v);
  });
  ch.flat().forEach(c=>{if(c==null||c===false)return;e.append(typeof c==="string"||typeof c==="number"?c:c);});
  return e;
}

// ── Periods ──
function rPeriods(){
  const ptab=$.ptab;
  const tabWrap=el("div",{cls:"nav",style:{marginBottom:"10px"}});
  [["pending","⏳ قيد التنفيذ",$.tasks.filter(t=>!t.done).length],["done","✅ المنجزة",$.tasks.filter(t=>t.done).length]].forEach(([v,l,c])=>{
    tabWrap.appendChild(el("button",{cls:`nav-btn${ptab===v?" on":""}`,onClick:()=>{$.ptab=v;render();}},l,el("span",{cls:"nav-badge"},c)));
  });
  const wrap=el("div",{},tabWrap);
  PERIODS.forEach((p,pi)=>{
    let tasks=$.tasks.filter(t=>t.period===p.id);
    if(ptab==="pending")tasks=tasks.filter(t=>!t.done);
    else tasks=tasks.filter(t=>t.done);
    const isOpen=$.openP.has(p.id);
    const hdr=el("div",{cls:`period-hdr ${p.cls}`,onClick:()=>{if(isOpen)$.openP.delete(p.id);else $.openP.add(p.id);render();}},
      el("span",{cls:"ph-icon"},p.icon),
      el("span",{cls:"ph-name"},p.name),
      el("span",{cls:"ph-cnt"},`${$.tasks.filter(t=>t.period===p.id&&!t.done).length} متبقية`),
      el("span",{cls:`ph-arr${isOpen?" open":""}`},"›")
    );
    const sec=el("div",{cls:"period",style:{animationDelay:`${pi*.07}s`}},hdr);
    if(isOpen){
      if(tasks.length===0){
        const msg=ptab==="done"?"لا توجد مهام منجزة":$.mode==="admin"?"أضيف مهام من فوق":"استنّي مهامك من محمد ☕";
        sec.appendChild(el("div",{cls:"empty"},el("div",{cls:"empty-icon"},ptab==="done"?"🌟":"✨"),el("div",{cls:"empty-title"},ptab==="done"?"مفيش منجزة هنا":"مفيش مهام هنا"),el("div",{cls:"empty-sub"},msg)));
      } else {
        const list=el("div",{cls:"task-list"});
        tasks.forEach(t=>list.appendChild(rCard(t)));
        sec.appendChild(list);
      }
    }
    wrap.appendChild(sec);
  });
  return wrap;
}

// ── Card ──
function rCard(task){
  const isAdmin=$.mode==="admin";
  const hl=$.newDone.has(task.id);
  const pri=PRIS[task.pri]||PRIS.m;
  const card=el("div",{cls:`card${task.done?" done-c":""}${hl?" hl":""}${task.urgent?" urgent-c":""}`});
  if(task.urgent)card.appendChild(el("div",{cls:"urgent-tag"},"⚡ عاجل"));
  if(task.repeat&&!task.urgent)card.appendChild(el("div",{cls:"repeat-tag"},"🔄 يومية"));
  if(hl&&isAdmin)card.appendChild(el("div",{cls:"new-tag"},"✨ جديد"));
  const chk=el("button",{cls:`chk${task.done?" on":""}`,disabled:isAdmin,
    onClick:()=>{
      if(isAdmin)return;
      if(!task.done){
        chk.classList.add("pop");
        const fm=el("div",{cls:"float"},MOTIV[Math.floor(Math.random()*MOTIV.length)]);
        card.appendChild(fm);
        playWin();showPts(pri.pts);
        setTimeout(()=>{chk.classList.remove("pop");fm.remove();},2300);
      }
      toggleTask(task.id);
    }
  },task.done?"✓":"");
  const body=el("div",{cls:"card-body"});
  body.appendChild(el("div",{cls:"card-title-row"},
    el("span",{cls:"c-emoji"},task.emoji),
    el("span",{cls:`c-text${task.done?" done-t":""}`},task.text),
    el("span",{cls:`pri-tag ${pri.cls}`},pri.l)
  ));
  if(task.likedBy){body.appendChild(el("div",{style:{fontSize:"12px",marginTop:"4px",color:"#f472b6",fontWeight:"700"}},`${task.likedBy} من محمد`));}
  const meta=el("div",{cls:"c-meta"});
  if(task.addedAt)meta.appendChild(el("span",{},`🕐 ${task.addedAt}`));

// ── News Check ──
function checkNews(){
  if($.mode!=="user")return;
  const totalDone=$.tasks.filter(t=>t.done).length+Object.values($.history).reduce((a,d)=>a+(d.done||0),0);

function initGardenFlowers(){

  $.gardenFlowers={};
  FLOWER_DATA.forEach((f,i)=>{

function getFlowerEmoji(flowerId,stage,wilted){

  if(stage===0)return"🔒";

  if(stage===2)return"🌿";
  return f.emoji;
}

    const plot=document.createElement("div");plot.className="garden-plot";
    // Flower emoji
    const flowerEl=document.createElement("div");

    flowerEl.className="garden-plot-flower"+(fState.wilted?" wilted":fState.stage>=3?" blooming":fState.stage===0?" locked":"");
    flowerEl.textContent=emojiStr;

    // Stem
    const stem=document.createElement("div");stem.className="garden-plot-stem";
    stem.style.height=(fState.stage*8+10)+"px";

    // Pot
    const pot=document.createElement("div");pot.className="garden-plot-pot";pot.textContent="🪣";
    // Water indicator
    const lbl=document.createElement("div");lbl.className="garden-plot-lbl";
    if(fState.stage===0)lbl.textContent="🔒 "+((FLOWER_DATA.indexOf(flowerDef))*8)+"م";
    else if(fState.wilted)lbl.textContent="🥀 تحتاج ري";
    else lbl.textContent="💧".repeat(Math.min(fState.water||0,3));

    plot.appendChild(flowerEl);plot.appendChild(stem);plot.appendChild(pot);plot.appendChild(lbl);
    if(fState.stage>0){

    if(fd&&fs)renderGardenPanel(sceneWrap,fd,fs,totalDone);

}

function renderGardenPanel(container,flowerDef,fState,totalDone){
  const old=container.querySelector(".garden-panel");if(old)old.remove();
  const panel=document.createElement("div");panel.className="garden-panel";
  const emojiEl=document.createElement("div");emojiEl.className="garden-panel-emoji";
  emojiEl.textContent=getFlowerEmoji(flowerDef.id,fState.stage,fState.wilted);
  const nameEl=document.createElement("div");nameEl.className="garden-panel-name";nameEl.textContent=flowerDef.name;
  const statusMsgs=["مش مفتوحة لسه","بذرة صغيرة 🌱","شتلة نامية 🌿","زهرة مزهرة ✨"];
  const statusEl=document.createElement("div");statusEl.className="garden-panel-status";
  statusEl.textContent=fState.wilted?"🥀 ذابلة — تحتاج ري عاجل!":statusMsgs[fState.stage]||"";
  const descEl=document.createElement("div");descEl.className="garden-panel-desc";descEl.textContent=flowerDef.desc;
  panel.appendChild(emojiEl);panel.appendChild(nameEl);panel.appendChild(statusEl);panel.appendChild(descEl);

  // Water button
  const waterBtn=document.createElement("button");waterBtn.className="garden-water-btn";
  const todayWatered=fState.lastWatered===today();
  waterBtn.textContent=todayWatered?"✅ تم الري اليوم — تعالي بكرة!":"💧 اسقي الزهرة!";
  waterBtn.disabled=todayWatered;
  if(!todayWatered){
    waterBtn.onclick=()=>{
      // Water animation
      for(let i=0;i<5;i++){
        const drop=document.createElement("div");drop.className="water-drop";drop.textContent="💧";
        drop.style.cssText=`left:${30+Math.random()*40}%;top:${40+Math.random()*20}%;animation-delay:${i*0.15}s`;
        container.appendChild(drop);setTimeout(()=>drop.remove(),1000);
      }
      const f=$.gardenFlowers[flowerDef.id];
      f.water=(f.water||0)+1;f.lastWatered=today();f.wilted=false;
      if(f.water>=flowerDef.waterNeeded&&f.stage<3){f.stage++;f.water=0;}
      ls("gardenFlowers",JSON.stringify($.gardenFlowers));
      setTimeout(()=>{$.selectedFlower=flowerDef.id;const old2=container.querySelector(".garden-panel");if(old2)old2.remove();renderGardenPanel(container,flowerDef,$.gardenFlowers[flowerDef.id],totalDone);},400);
    };
  }
  const closeBtn=document.createElement("button");closeBtn.className="garden-close-btn";closeBtn.textContent="← رجوع للحديقة";
  closeBtn.onclick=()=>{$.selectedFlower=null;const p=container.querySelector(".garden-panel");if(p)p.remove();};
  panel.appendChild(waterBtn);panel.appendChild(closeBtn);
  container.appendChild(panel);
}

// ══ STARS SKY 🌙 ══
function rStarsSky(){
  const totalDone=$.tasks.filter(t=>t.done).length+Object.values($.history).reduce((a,d)=>a+(d.done||0),0);
  const allDone=$.tasks.length>0&&$.tasks.filter(t=>!t.done).length===0;
  const stars=Math.min(totalDone,40);
  const STAR_TYPES=["⭐","✨","💫","🌟"];
  const wrap=el("div",{cls:"sky-card"});
  wrap.appendChild(el("div",{cls:"sky-title"},"🌙 سماء تيغو — كل مهمة تضيء نجمة"));
  const field=el("div",{cls:"sky-field"});
  if(allDone)field.appendChild(el("div",{cls:"sky-moon"},"🌕"));
  else field.appendChild(el("div",{cls:"sky-moon"},"🌙"));
  for(let i=0;i<stars;i++){
    const star=el("div",{cls:"star-item",style:{animationDelay:`${(i*0.37)%2}s`}},STAR_TYPES[i%STAR_TYPES.length]);
    field.appendChild(star);
  }
  if(stars===0)field.appendChild(el("div",{style:{color:"rgba(255,255,255,.4)",fontSize:"13px",fontWeight:"700"}},"سمائك فاضية — خلصي مهمة تضيء نجمة! ✨"));
  wrap.appendChild(field);
  wrap.appendChild(el("div",{cls:"sky-msg"},allDone?"🌕 القمر كامل! خلصتِ كل مهامك — ما شاء الله! 🎉":`${stars} نجمة — كملي وكملي! 🌟`));
  return wrap;
}

// ── Breaking News Ticker ──
let _tickerIdx=0,_tickerTimer=null;
function startTicker(){
  const el2=document.getElementById("tickerText");
  if(!el2)return;
  const items=$.tickerNews.length>0?$.tickerNews:TICKER_DEFAULT;
  const item=items[_tickerIdx%items.length];
  const fullText=(item.icon||"🔴")+" "+item.text;
  const charCount=fullText.length;
  const duration=Math.max(6,charCount*0.13); // ~0.13s per char
  el2.style.setProperty("--td",duration+"s");
  el2.style.setProperty("--sc",charCount);
  el2.textContent=fullText;
  el2.className="ticker-text";
  // After reveal, pause then fade out then next
  if(_tickerTimer)clearTimeout(_tickerTimer);
  _tickerTimer=setTimeout(()=>{
    el2.classList.add("ticker-fade");
    setTimeout(()=>{
      _tickerIdx++;
      startTicker();
    },600);
  },(duration+2)*1000);
}

function rTicker(){
  const ticker=document.createElement("div");
  ticker.className="news-ticker";
  ticker.appendChild(el("div",{cls:"ticker-label"},el("div",{cls:"ticker-dot"}),"عاجل"));
  const track=el("div",{cls:"ticker-track"});
  const txt=document.createElement("span");
  txt.id="tickerText";
  txt.className="ticker-text";
  track.appendChild(txt);
  ticker.appendChild(track);
  setTimeout(startTicker,100);
  return ticker;
}

// ── Diary ──
function rDiary(){
  const todayKey=today();
  const todayEntry=$.history[todayKey]?.diary||"";
  const allEntries=Object.entries($.history).filter(([k,v])=>v.diary).sort(([a],[b])=>b.localeCompare(a));
  let saved=false;
  const inp=el("textarea",{cls:"diary-inp",placeholder:"اكتبي حاجة عن يومك يا تيغو... 🌸"});
  inp.value=todayEntry;
  const savedMsg=el("div",{cls:"diary-saved",style:{display:"none"}},"✓ اتحفظت يا قمر! 🌸");
  const saveBtn=el("button",{cls:"diary-save",onClick:async()=>{
    if(!$.fbOk||!inp.value.trim())return;
    const snap={...$.history[todayKey]||{date:todayKey},diary:inp.value.trim()};
    await window._set(window._ref(window._db,`hist/${todayKey}`),snap);
    $.history[todayKey]=snap;
    savedMsg.style.display="block";
    setTimeout(()=>savedMsg.style.display="none",2000);
  }},"احفظي يومياتك 💌");
  const wrap=el("div",{cls:"diary-card"});
  wrap.appendChild(el("div",{cls:"diary-title"},"📖 يوميات تيغو"));
  wrap.appendChild(el("div",{cls:"diary-date"},new Date().toLocaleDateString("ar-EG",{weekday:"long",year:"numeric",month:"long",day:"numeric"})));
  wrap.appendChild(inp);wrap.appendChild(savedMsg);wrap.appendChild(saveBtn);
  // Past entries
  if(allEntries.length>0){
    wrap.appendChild(el("div",{style:{fontSize:"13px",fontWeight:"800",color:"var(--text2)",margin:"14px 0 8px"}},"📅 يومياتك السابقة"));
    allEntries.slice(0,5).forEach(([k,v])=>{
      if(k===todayKey)return;
      const entry=el("div",{cls:"diary-entry"});
      entry.appendChild(el("div",{cls:"diary-entry-date"},dateAr(k)));
      entry.appendChild(el("div",{cls:"diary-entry-text"},v.diary));
      wrap.appendChild(entry);
    });
  }
  return wrap;
}

// ── Weekly Summary ──
function rWeeklySummary(){
  const td=new Date();
  let totalTasks=0,totalDone=0,totalPts=0,bestDay="",bestPct=0;
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(td);d.setDate(td.getDate()-i);
    const key=d.toISOString().slice(0,10);
    const dd=$.history[key];
    if(dd){totalTasks+=dd.total||0;totalDone+=dd.done||0;totalPts+=dd.pts||0;const p=dd.total>0?Math.round(dd.done/dd.total*100):0;if(p>bestPct){bestPct=p;bestDay=DAYS_AR[d.getDay()];}}
    days.push({key,dd});
  }
  const pct=totalTasks>0?Math.round(totalDone/totalTasks*100):0;
  return el("div",{cls:"summary-pop"},
    el("div",{cls:"summary-card"},
      el("div",{style:{fontSize:"40px",textAlign:"center",marginBottom:"10px",animation:"float 2s ease-in-out infinite"}},"🎬"),
      el("div",{cls:"summary-title"},"ملخص أسبوعك 🌟"),
      el("div",{cls:"summary-sub"},"يا تيغو شوفي إنتِ عملتِ إيه الأسبوع ده!"),
      el("div",{cls:"summary-stat"},el("span",{cls:"summary-stat-lbl"},"المهام المنجزة"),el("span",{cls:"summary-stat-val"},`${totalDone}/${totalTasks}`)),
      el("div",{cls:"summary-stat"},el("span",{cls:"summary-stat-lbl"},"نسبة النجاح"),el("span",{cls:"summary-stat-val"},`${pct}%`)),
      el("div",{cls:"summary-stat"},el("span",{cls:"summary-stat-lbl"},"النقاط المكتسبة"),el("span",{cls:"summary-stat-val"},`⭐ ${totalPts}`)),
      el("div",{cls:"summary-stat"},el("span",{cls:"summary-stat-lbl"},"أفضل يوم"),el("span",{cls:"summary-stat-val"},bestDay||"—")),
      el("div",{cls:"summary-stat"},el("span",{cls:"summary-stat-lbl"},"الأيام المتواصلة"),el("span",{cls:"summary-stat-val"},`🔥 ${$.streak}`)),
      el("button",{cls:"summary-close",onClick:()=>{$.weekSummaryPop=false;render();}},"يلا كملي يا بطلة! 🌸")
    )
  );
}
